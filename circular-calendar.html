<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zirkularer Kalender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .calendar-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            position: relative;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .event-list {
            margin-top: 30px;
            max-height: 200px;
            overflow-y: auto;
        }

        .event-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-info {
            flex: 1;
        }

        .event-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .event-dates {
            font-size: 12px;
            color: #666;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #ff3838;
        }

        .add-btn {
            grid-column: 1 / -1;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .add-btn:hover {
            background: #5568d3;
        }

        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Zirkularer Jahreskalender</h1>

        <div class="controls">
            <div class="form-group">
                <label for="startMonth">Monat bei 12:00 Uhr:</label>
                <select id="startMonth">
                    <option value="0">Januar</option>
                    <option value="1" selected>Februar</option>
                    <option value="2">März</option>
                    <option value="3">April</option>
                    <option value="4">Mai</option>
                    <option value="5">Juni</option>
                    <option value="6">Juli</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9">Oktober</option>
                    <option value="10">November</option>
                    <option value="11">Dezember</option>
                </select>
            </div>

            <div class="form-group">
                <label for="year">Jahr:</label>
                <input type="number" id="year" value="2025" min="2000" max="2100">
            </div>

            <div class="form-group full-width">
                <label for="eventTitle">Titel:</label>
                <input type="text" id="eventTitle" placeholder="z.B. Projekt Alpha">
            </div>

            <div class="form-group">
                <label for="startDate">Startdatum:</label>
                <input type="date" id="startDate">
            </div>

            <div class="form-group">
                <label for="endDate">Enddatum:</label>
                <input type="date" id="endDate">
            </div>

            <button class="add-btn" onclick="addEvent()">Zeitraum hinzufügen</button>
        </div>

        <div class="calendar-container">
            <canvas id="calendarCanvas" width="600" height="600"></canvas>
        </div>

        <div class="event-list" id="eventList"></div>
    </div>

    <script>
        const canvas = document.getElementById('calendarCanvas');
        const ctx = canvas.getContext('2d');
        const events = [];

        const monthNames = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun',
                           'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

        const monthColors = [
            '#e3f2fd', '#bbdefb', '#90caf9', '#64b5f6',
            '#42a5f5', '#2196f3', '#1e88e5', '#1976d2',
            '#1565c0', '#0d47a1', '#82b1ff', '#448aff'
        ];

        // Set default dates
        const today = new Date();
        document.getElementById('startDate').value = today.toISOString().split('T')[0];
        const nextMonth = new Date(today);
        nextMonth.setMonth(today.getMonth() + 1);
        document.getElementById('endDate').value = nextMonth.toISOString().split('T')[0];

        function drawCalendar() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const outerRadius = 250;
            const innerRadius = 150;
            const startMonth = parseInt(document.getElementById('startMonth').value);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw month segments
            for (let i = 0; i < 12; i++) {
                const monthIndex = (startMonth + i) % 12;
                const startAngle = (i * 30 - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * 30 - 90) * Math.PI / 180;

                // Draw outer ring (months)
                ctx.beginPath();
                ctx.arc(centerX, centerY, outerRadius, startAngle, endAngle);
                ctx.arc(centerX, centerY, innerRadius, endAngle, startAngle, true);
                ctx.closePath();
                ctx.fillStyle = monthColors[monthIndex];
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw month labels
                const labelAngle = (i * 30 + 15 - 90) * Math.PI / 180;
                const labelRadius = (outerRadius + innerRadius) / 2;
                const labelX = centerX + Math.cos(labelAngle) * labelRadius;
                const labelY = centerY + Math.sin(labelAngle) * labelRadius;

                ctx.save();
                ctx.translate(labelX, labelY);
                ctx.rotate(labelAngle + Math.PI / 2);
                ctx.fillStyle = '#333';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(monthNames[monthIndex], 0, 0);
                ctx.restore();
            }

            // Draw events
            events.forEach((event, index) => {
                drawEvent(event, index);
            });

            // Draw center circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, 2 * Math.PI);
            ctx.fillStyle = '#667eea';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw year in center
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(document.getElementById('year').value, centerX, centerY);
        }

        function dateToAngle(date) {
            const startMonth = parseInt(document.getElementById('startMonth').value);
            const year = parseInt(document.getElementById('year').value);

            // Calculate day of year
            const start = new Date(year, 0, 1);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            const daysInYear = isLeapYear(year) ? 366 : 365;

            // Calculate angle (0 = top, clockwise)
            let angle = (dayOfYear / daysInYear) * 360;

            // Adjust for start month
            const startMonthDays = new Date(year, startMonth, 1) - start;
            const startMonthDayOfYear = Math.floor(startMonthDays / oneDay);
            angle -= (startMonthDayOfYear / daysInYear) * 360;

            return angle;
        }

        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }

        function drawEvent(event, index) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 120 - (index * 15);

            if (radius < 60) return; // Don't draw if too close to center

            const startAngle = (dateToAngle(event.startDate) - 90) * Math.PI / 180;
            const endAngle = (dateToAngle(event.endDate) - 90) * Math.PI / 180;

            // Draw arc
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.strokeStyle = event.color;
            ctx.lineWidth = 12;
            ctx.stroke();

            // Draw start and end markers
            const startX = centerX + Math.cos(startAngle) * radius;
            const startY = centerY + Math.sin(startAngle) * radius;
            const endX = centerX + Math.cos(endAngle) * radius;
            const endY = centerY + Math.sin(endAngle) * radius;

            ctx.beginPath();
            ctx.arc(startX, startY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = event.color;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(endX, endY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = event.color;
            ctx.fill();
        }

        function addEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);
            const year = parseInt(document.getElementById('year').value);

            if (!title) {
                alert('Bitte geben Sie einen Titel ein.');
                return;
            }

            if (!document.getElementById('startDate').value || !document.getElementById('endDate').value) {
                alert('Bitte geben Sie Start- und Enddatum ein.');
                return;
            }

            if (startDate > endDate) {
                alert('Das Startdatum muss vor dem Enddatum liegen.');
                return;
            }

            if (startDate.getFullYear() !== year || endDate.getFullYear() !== year) {
                alert(`Beide Daten müssen im Jahr ${year} liegen.`);
                return;
            }

            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e'];
            const color = colors[events.length % colors.length];

            events.push({
                title,
                startDate,
                endDate,
                color
            });

            updateEventList();
            drawCalendar();

            // Clear input
            document.getElementById('eventTitle').value = '';
        }

        function deleteEvent(index) {
            events.splice(index, 1);
            updateEventList();
            drawCalendar();
        }

        function updateEventList() {
            const listContainer = document.getElementById('eventList');
            listContainer.innerHTML = '';

            events.forEach((event, index) => {
                const item = document.createElement('div');
                item.className = 'event-item';
                item.innerHTML = `
                    <div class="event-info">
                        <div class="event-title" style="color: ${event.color}">${event.title}</div>
                        <div class="event-dates">
                            ${event.startDate.toLocaleDateString('de-DE')} - ${event.endDate.toLocaleDateString('de-DE')}
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteEvent(${index})">Löschen</button>
                `;
                listContainer.appendChild(item);
            });
        }

        // Event listeners
        document.getElementById('startMonth').addEventListener('change', drawCalendar);
        document.getElementById('year').addEventListener('change', () => {
            drawCalendar();
            // Update date inputs to new year
            const currentStart = new Date(document.getElementById('startDate').value);
            const currentEnd = new Date(document.getElementById('endDate').value);
            const year = document.getElementById('year').value;

            currentStart.setFullYear(year);
            currentEnd.setFullYear(year);

            document.getElementById('startDate').value = currentStart.toISOString().split('T')[0];
            document.getElementById('endDate').value = currentEnd.toISOString().split('T')[0];
        });

        // Initial draw
        drawCalendar();
    </script>
</body>
</html>
